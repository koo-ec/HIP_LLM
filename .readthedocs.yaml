# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# The Sphinx configuration is stored under docs/source/.
sphinx:
  configuration: docs/source/conf.py

# Install HIPLLM, its documentation extras and documentation-only build tools.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    - requirements: docs/requirements.txt
