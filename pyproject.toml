[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hip-llm-replication"
version = "1.0.0"
description = "Tested replication of HIP-LLM reliability inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Robab Aghazadeh Chakherlou" },
  { name = "Qing Guo" },
  { name = "Siddartha Khastgir" },
  { name = "Peter Popov" },
  { name = "Xiaoge Zhang" },
  { name = "Xingyu Zhao" },
]
keywords = ["reliability", "imprecise probability", "hierarchical Bayes", "LLM evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.10",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/koo-ec/HIP_LLM"
Repository = "https://github.com/koo-ec/HIP_LLM"
Issues = "https://github.com/koo-ec/HIP_LLM/issues"
Publication = "https://doi.org/10.1016/j.ress.2026.112615"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.3", "nbformat>=5.10", "papermill>=2.6", "ipykernel>=6.29"]
live = ["openai>=1.40", "anthropic>=0.40", "datasets>=2.20"]
profile = ["psutil>=5.9"]
dev = ["ruff>=0.6", "build>=1.2"]
all = [
  "pytest>=8.0", "pytest-timeout>=2.3", "nbformat>=5.10", "papermill>=2.6",
  "ipykernel>=6.29", "openai>=1.40", "anthropic>=0.40", "datasets>=2.20",
  "psutil>=5.9", "ruff>=0.6", "build>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hip_llm*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits real provider APIs and costs money",
  "slow: long-running numerical convergence or scalability checks",
  "notebook: executes the replication notebook end to end",
]
filterwarnings = [
  "error::RuntimeWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["HIP_LLM_exact_replication.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
